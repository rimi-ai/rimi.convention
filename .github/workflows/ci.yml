name: convention.json

# The text is the source. convention.json is only its projection: this workflow
# rebuilds it from en.md and fails when the committed file no longer matches.
#
# It also holds two things the projection cannot check on its own: that a copy
# published with a release still projects the text of that release, and that the
# two languages still carry the same rules — the same rules in the same order,
# with the same principle and the same obligations. Structure, never meaning.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags are needed: a frozen copy is checked against its own tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the schema validator
        run: pip install --quiet "jsonschema==4.23.0"

      - name: The committed projection is the one en.md produces
        run: python3 tools/build_convention_json.py --check

      - name: Every published copy validates against the schema
        run: python3 tools/validate_convention_json.py

      - name: Every frozen copy is what its own tag projects — fingerprint and content
        run: python3 tools/check_frozen_versions.py

      - name: The two languages state the same obligations, in table rows and in rule bodies (structure, not meaning)
        run: python3 tools/check_translation_parity.py

      - name: Tool tests, planted defects included: each check is shown failing on the fault it exists for
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
