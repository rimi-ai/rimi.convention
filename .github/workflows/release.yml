name: release

# When a release is published: rebuild convention.json from en.md, sign it with
# no private key anywhere (Sigstore keyless: the identity is this workflow's OIDC
# token, the signature is recorded in the public Rekor transparency log), attest
# where it came from, attach it to the release, and check that GitHub Pages
# serves the same file.
#
# The trigger is the published release, not the tag: the release notes are
# written by a human, and the assets belong to the release they describe.
#
# workflow_dispatch signs a release published before this workflow existed. Its
# tag is left untouched: the run checks out the branch it was started from and
# refuses to go on unless en.md at that tag is byte-for-byte the text it is
# projecting.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release to sign (e.g. v0.3.0)'
        required: true

permissions:
  contents: write      # attach the assets to the release
  id-token: write      # keyless signature: OIDC identity of this run
  attestations: write  # build provenance

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the schema validator
        run: pip install --quiet "jsonschema==4.23.0"

      - name: The tag, the text and the projection say the same version
        run: |
          version="${TAG#v}"
          stated="$(python3 -c "import json; print(json.load(open('convention.json'))['convention_version'])")"
          if [ "$version" != "$stated" ]; then
            echo "release $TAG does not match the version stated in the convention ($stated)." >&2
            exit 1
          fi
          if [ ! -f "versions/$TAG/convention.json" ]; then
            echo "versions/$TAG/convention.json is missing." >&2
            echo "Run python3 tools/build_convention_json.py --freeze and commit it before releasing." >&2
            exit 1
          fi

      - name: The text at this tag is the text being signed
        run: |
          git show "$TAG:en.md" > en-at-tag.md
          if ! cmp -s en.md en-at-tag.md; then
            echo "en.md has changed since $TAG: this checkout cannot sign that release." >&2
            exit 1
          fi
          rm en-at-tag.md

      - name: The committed projection is the one en.md produces
        run: python3 tools/build_convention_json.py --check

      - name: The frozen copy is byte-for-byte the published file
        run: cmp convention.json "versions/$TAG/convention.json"

      - name: The file validates against the schema
        run: python3 tools/validate_convention_json.py convention.json

      - name: No published copy has been rewritten since its own release
        run: python3 tools/check_frozen_versions.py

      - name: Fingerprint
        id: fingerprint
        run: echo "sha256=$(sha256sum convention.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Sign, without any private key
        run: |
          cosign sign-blob --yes convention.json --bundle convention.json.sigstore.json

      - name: Verify the signature, the way a third party would
        run: |
          cosign verify-blob convention.json \
            --bundle convention.json.sigstore.json \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Attest where this file comes from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: convention.json

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            convention.json convention.json.sigstore.json --clobber

      - name: GitHub Pages serves this release
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 tools/check_published.py \
            --file convention.json \
            --url "$site/convention.json" \
            --url "$site/versions/$TAG/convention.json"

      - name: Summary
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          {
            echo "### convention.json"
            echo
            echo "- version: \`$TAG\`"
            echo "- sha256: \`${{ steps.fingerprint.outputs.sha256 }}\`"
            echo "- latest: $site/convention.json"
            echo "- frozen: $site/versions/$TAG/convention.json"
            echo "- signature: keyless (Sigstore), identity of this workflow, recorded in Rekor"
          } >> "$GITHUB_STEP_SUMMARY"
